<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Browser</title>
<style>
  :root { --bg:#12141c; --panel:#1b1f2b; --line:#2a3042; --text:#e6e8ef; --dim:#8b93a8; --accent:#8fa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; align-items:center; }
  input, select, button { background:var(--bg); color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:8px 10px; font:inherit; }
  select { color-scheme:dark; } /* dark native dropdown (no white popup frame/gaps) */
  select option { background:var(--panel); color:var(--text); }
  button { cursor:pointer; }
  button:hover, button.on { border-color:var(--accent); color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .types { display:flex; gap:6px; }
  #pinned { display:contents; }
  #menu { margin-left:auto; }
  #sugwrap { position:relative; flex:1 1 160px; min-width:0; display:flex; }
  #sugwrap input { flex:1; min-width:0; }
  #sug { position:absolute; top:100%; left:0; right:0; z-index:8; margin-top:4px; background:var(--panel);
         border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  [hidden] { display:none !important; }
  #sug div { padding:7px 10px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
  #sug div:hover { background:var(--bg); }
  #sug span { color:var(--dim); font-size:12px; }
  /* settings side panel */
  #panel { position:fixed; top:0; right:0; bottom:0; width:300px; max-width:90vw; z-index:9; background:var(--panel);
           border-left:1px solid var(--line); padding:14px; overflow:auto; }
  #panel .ph { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  #panel h3 { margin:16px 0 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .ctl { display:flex; align-items:center; gap:8px; }
  #panel .ctl { justify-content:space-between; padding:5px 0; }
  #panel .ctl > button { width:100%; }
  .ctl input, .pin input { flex:none; padding:0; }
  .ctl label { color:var(--dim); }
  .ctl label.keep { color:var(--text); display:flex; gap:6px; align-items:center; }
  #pinned .ctl label:not(.keep) { display:none; }
  #size { width:130px; }
  .pin { display:flex; gap:8px; align-items:center; padding:3px 0; color:var(--dim); }
  #grid { columns:260px; column-gap:10px; padding:12px; }
  .card { break-inside:avoid; margin:0 0 10px; background:var(--panel); border-radius:10px; overflow:hidden;
          content-visibility:auto; contain-intrinsic-size:auto 320px; }
  .card img, .card video { display:block; width:100%; height:auto; background:#000; }
  .card img, .card video.gifv { cursor:zoom-in; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 10px; }
  .bar a { flex:1; color:var(--dim); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar a:hover { color:var(--text); }
  .bar .kind { color:var(--accent); font-size:12px; }
  .bar button { flex:none; padding:4px 10px; }
  .blurnsfw .card:is([data-rating="q"],[data-rating="e"]):not(.reveal) :is(img, video) { filter:blur(28px) brightness(.7); }
  #lbm.hid img, #lbm.hid video { filter:blur(30px) brightness(.7); }
  .card.broken .kind::after { content:' · failed'; color:#e88; }
  .card.saved .dl { color:var(--accent); border-color:var(--accent); }
  #status { text-align:center; color:var(--dim); padding:24px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:30; background:var(--panel);
           border:1px solid var(--line); padding:8px 14px; border-radius:8px; }
  #priv { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--line); }
  #lb { --bar:56px; --top:8px; position:fixed; inset:0; z-index:10; background:rgba(8,9,14,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:var(--top); padding-bottom:var(--bar); }
  #lbm { display:flex; }
  /* media and tags are centered together above the bottom bar (--bar), so tags never overlap the media;
     96px = tag strip (72px) + gaps */
  #lbm img, #lbm video { max-width:92vw; max-height:calc(100vh - var(--bar) - var(--top) - 96px); max-height:calc(100dvh - var(--bar) - var(--top) - 96px); object-fit:contain; border-radius:6px; }
  #lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:28px; padding:10px 16px; }
  #lbp { left:12px; } #lbn { right:12px; }
  #lbx { position:absolute; top:12px; right:12px; }
  #lbtags { width:100%; margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:0 64px; max-height:72px; overflow:auto; }
  #lbtags:empty { display:none; }
  #lbtags button { padding:2px 8px; font-size:12px; color:var(--dim); }
  #lbbar { position:absolute; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:center; padding:12px; color:var(--dim); }
  #lbt { max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:600px) { #lb { --bar:100px; } }
  #lbbar a { color:var(--text); }
</style>
</head>
<body>
<header>
  <select id="source" aria-label="Source">
    <option value="danbooru">Danbooru</option>
    <option value="safebooru">Safebooru</option>
    <option value="yandere">Yande.re</option>
    <option value="wallhaven">Wallhaven</option>
    <option value="nekos">nekos.best (SFW GIFs)</option>
    <option value="waifuim">waifu.im (SFW)</option>
    <option value="waifuimx">waifu.im (NSFW)</option>
    <option value="gelbooru">Gelbooru (needs key)</option>
  </select>
  <div id="sugwrap"><input id="q" autocomplete="off" aria-label="Tags or search"><div id="sug" hidden></div></div>
  <select id="sort" aria-label="Feed">
    <option value="latest">Latest</option>
    <option value="popular">Popular</option>
    <option value="random">Random</option>
  </select>
  <button id="go">Load</button>
  <div class="types" role="group" aria-label="Filter by type">
    <button data-t="all">All</button>
    <button data-t="image">Images</button>
    <button data-t="gif">GIFs</button>
    <button data-t="video">Videos</button>
  </div>
  <div id="pinned"></div>
  <button id="refresh" title="Retry broken media, or reload the feed if nothing is broken">Refresh</button>
  <button id="menu" title="Settings">☰ Menu</button>
</header>
<aside id="panel" hidden>
  <div class="ph"><b>Menu</b><button id="px" aria-label="Close">✕</button></div>
  <h3>Filters</h3>
  <div class="ctl" data-k="rating" data-label="Rating filter"><label>Rating</label>
    <select id="rating"><option value="all">Any</option><option value="s">Safe</option><option value="q">Questionable</option><option value="e">Explicit</option></select></div>
  <div class="ctl" data-k="orient" data-label="Shape filter"><label>Shape</label>
    <select id="orient"><option value="all">Any</option><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></div>
  <h3>Display</h3>
  <div class="ctl" data-k="size" data-label="Grid size"><label>Grid size</label>
    <input type="range" id="size" min="160" max="480" step="20" value="260" aria-label="Thumbnail size"></div>
  <div class="ctl" data-k="limit" data-label="Items per load"><label>Per load</label>
    <select id="limit"><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="30">30</option><option value="50">50</option></select></div>
  <div class="ctl" data-k="auto" data-label="Auto-load on scroll"><label class="keep"><input type="checkbox" id="auto"> Auto-load on scroll</label></div>
  <div class="ctl" data-k="blur" data-label="Blur NSFW"><label class="keep"><input type="checkbox" id="blur"> Blur NSFW</label></div>
  <h3>Actions</h3>
  <div class="ctl" data-k="saveall" data-label="Save all"><button id="saveall" title="Save everything shown to the downloads folder">Save all shown</button></div>
  <div class="ctl" data-k="reset" data-label="Reset"><button id="reset" title="Clear search and filters">Reset search &amp; filters</button></div>
  <div class="ctl" data-k="hide" data-label="Hide page"><button id="hide" title="Or press the ` key">Hide page</button></div>
  <h3>Pin to top bar</h3>
  <div id="pinlist"></div>
</aside>
<main>
  <div id="grid"></div>
  <div id="status"></div>
</main>
<div id="lb" hidden>
  <button id="lbx" aria-label="Close">✕</button>
  <button class="nav" id="lbp" aria-label="Previous">‹</button>
  <div id="lbm"></div>
  <button class="nav" id="lbn" aria-label="Next">›</button>
  <div id="lbtags"></div>
  <div id="lbbar"><span id="lbt"></span><a id="lbl" target="_blank" rel="noopener">Source</a><button id="lbd">Save</button><span id="lbc"></span></div>
</div>
<div id="priv" hidden>click, Esc or ` to show</div>
<div id="toast" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const grid = $('#grid'), statusEl = $('#status'), panel = $('#panel');
const HINTS = {
  danbooru: 'tags, max 2 (empty = browse everything)', safebooru: 'tags, max 2 (empty = browse everything)',
  yandere: 'tags (empty = browse everything)', wallhaven: 'search (empty = browse everything)',
  waifuim: 'tags, e.g. waifu maid (empty = browse everything)', waifuimx: 'tags, e.g. waifu maid (empty = browse everything)',
  gelbooru: 'tags (empty = browse everything)',
  nekos: 'category: neko, waifu, kitsune, hug, pat, dance… (empty = neko)',
};
const DEF = { source: 'danbooru', q: '', sort: 'latest', type: 'all', rating: 'all', orient: 'all', size: '260', limit: '15', blur: true, auto: true, pins: [] };
let next = null, done = false, empty = 0, type = 'all', pins = new Set();
// Loading state: ctl = the request in flight (null when idle), gen = which feed we're on (bumped on every
// new search/source/filter), failed = last request errored, seen/requested = media urls and cursors used so far
let ctl = null, gen = 0, failed = false, seen = new Set(), requested = new Set();
const MAX_EMPTY = 3; // auto-load pauses after this many batches in a row that add nothing visible

// ---- menu: controls can be pinned to the top bar ----
const ctls = [...document.querySelectorAll('.ctl')];
ctls.forEach((c) => {
  c.__ph = document.createComment(''); c.before(c.__ph);
  const l = document.createElement('label'); l.className = 'pin';
  l.innerHTML = '<input type="checkbox"> '; l.firstChild.dataset.pin = c.dataset.k; l.append(c.dataset.label);
  $('#pinlist').append(l);
});
function placePins() {
  ctls.forEach((c) => (pins.has(c.dataset.k) ? $('#pinned').append(c) : c.__ph.after(c)));
  document.querySelectorAll('[data-pin]').forEach((i) => { i.checked = pins.has(i.dataset.pin); });
}
$('#pinlist').onchange = (e) => {
  const k = e.target.dataset.pin;
  if (!k) return;
  e.target.checked ? pins.add(k) : pins.delete(k);
  placePins(); save();
};
$('#menu').onclick = () => { panel.hidden = !panel.hidden; };
$('#px').onclick = () => { panel.hidden = true; };

// ---- remember settings across refreshes ----
const getState = () => ({
  source: $('#source').value, q: $('#q').value, sort: $('#sort').value, type,
  rating: $('#rating').value, orient: $('#orient').value, size: $('#size').value,
  limit: $('#limit').value, blur: $('#blur').checked, auto: $('#auto').checked, pins: [...pins],
});
function save() { try { localStorage.setItem('mb', JSON.stringify(getState())); } catch {} }
function applyState(s) {
  $('#source').value = s.source; if (!$('#source').value) $('#source').value = 'danbooru';
  $('#q').value = s.q; $('#sort').value = s.sort;
  type = s.type; $('#rating').value = s.rating; $('#orient').value = s.orient;
  $('#size').value = s.size; grid.style.columns = s.size + 'px';
  $('#limit').value = s.limit; $('#blur').checked = s.blur; $('#auto').checked = s.auto;
  document.body.classList.toggle('blurnsfw', s.blur);
  pins = new Set(s.pins || []); placePins();
  hint(); markType();
}
function restore() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('mb')) || {}; } catch {}
  applyState({ ...DEF, ...s });
}
const hint = () => { $('#q').placeholder = HINTS[$('#source').value]; };
const markType = () => document.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === type));

const toast = (() => {
  let t;
  return (m) => { const el = $('#toast'); el.textContent = m; el.hidden = false; clearTimeout(t); t = setTimeout(() => { el.hidden = true; }, 2500); };
})();

// ---- filters (client-side, applied to what's loaded) ----
function shown(c) {
  const r = $('#rating').value, o = $('#orient').value;
  return !((type !== 'all' && c.dataset.type !== type) ||
           (r !== 'all' && c.dataset.rating !== r) ||
           (o !== 'all' && c.dataset.o !== o));
}
function applyFilters() {
  grid.querySelectorAll('.card').forEach((c) => { c.hidden = !shown(c); });
  save(); empty = 0; fill();
}

const px = (u) => '/api/dl?inline=1&url=' + encodeURIComponent(u);

// Source data is untrusted. Elements are built with DOM APIs (never HTML strings) so titles, urls, types and
// tags stay data. Links from sources must be absolute http(s) URLs; anything else (javascript:, data:, relative
// paths into this app...) becomes '' and the link is left inert.
function safeHref(u) {
  try {
    const x = new URL(u);
    return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : '';
  } catch { return ''; }
}
function mediaEl(it) {
  const mk = (tag, attrs) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  if (it.type === 'image') return mk('img', { decoding: 'async', loading: 'lazy', src: px(it.thumb || it.url), alt: '' });
  if (it.type === 'gif' && /\.(mp4|webm)/.test(it.url)) {
    const v = mk('video', { class: 'gifv', 'data-src': px(it.url), muted: '', loop: '', playsinline: '', preload: 'none' });
    v.muted = true; // the muted attribute alone only applies to parser-created elements
    return v;
  }
  if (it.type === 'gif') return mk('img', { decoding: 'async', loading: 'lazy', src: px(it.url), alt: '' });
  const attrs = { src: px(it.url), controls: '', preload: 'none' };
  if (it.thumb) attrs.poster = px(it.thumb);
  return mk('video', attrs);
}

// GIF-style videos only load and play while on screen (keeps the page light)
const vio = new IntersectionObserver((es) => es.forEach((e) => {
  const v = e.target;
  if (e.isIntersecting) { if (!v.getAttribute('src')) v.src = v.dataset.src; v.play().catch(() => {}); }
  else v.pause();
}), { rootMargin: '300px' });

function card(it) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.type = it.type; el.dataset.rating = it.rating || 's';
  el.dataset.o = (it.w || 1) >= (it.h || 1) ? 'landscape' : 'portrait';
  el.hidden = !shown(el);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<span class="kind"></span><a class="src" target="_blank" rel="noopener"></a><button class="view" type="button">View</button><button class="dl" type="button">Save</button>'; // static template, no source data
  bar.querySelector('.kind').textContent = it.type;
  el.append(mediaEl(it), bar);
  el.querySelectorAll('video.gifv').forEach((v) => vio.observe(v));
  const a = bar.querySelector('.src'), href = safeHref(it.link);
  a.textContent = it.title; if (href) a.href = href;
  Object.assign(el.dataset, { url: it.url, title: it.title, link: href, tags: it.tags || '', src: $('#source').value });
  return el;
}

// ---- saving to the downloads folder (on the PC running the server) ----
async function saveCard(c) {
  const ext = c.dataset.url.split('?')[0].split('.').pop() || 'bin';
  const name = `${c.dataset.src}_${c.dataset.title.replace('#', '')}.${ext}`;
  const r = await fetch('/api/save?url=' + encodeURIComponent(c.dataset.url) + '&name=' + encodeURIComponent(name));
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  c.classList.add('saved'); c.querySelector('.dl').textContent = 'Saved ✓';
  return j;
}
async function saveOne(c) {
  try { const j = await saveCard(c); toast(j.existed ? 'Already in downloads folder' : 'Saved to downloads folder'); }
  catch (e) { toast('Save failed: ' + e.message); }
}
$('#saveall').onclick = async () => {
  const list = [...grid.querySelectorAll('.card')].filter((c) => !c.hidden && !c.classList.contains('saved'));
  if (!list.length) return toast('Nothing new to save');
  let ok = 0, bad = 0;
  for (let i = 0; i < list.length; i += 3) {
    await Promise.all(list.slice(i, i + 3).map((c) => saveCard(c).then(() => ok++, () => bad++)));
    toast(`Saving… ${ok + bad}/${list.length}`);
  }
  toast(`Saved ${ok}${bad ? `, ${bad} failed` : ''}`);
};

// One feed request at a time. reset = start a new feed (new search/source/filters), which cancels any request
// still in flight. manual = a deliberate click (Load more / Retry), which gets past the auto-load pause.
async function load(reset, manual) {
  if (reset) {
    gen++; if (ctl) ctl.abort(); ctl = null;
    vio.disconnect(); grid.innerHTML = '';
    next = null; done = false; failed = false; empty = 0; seen = new Set(); requested = new Set();
    save();
  } else if (ctl || done || (failed && !manual)) return;
  if (manual && !reset) empty = Math.min(empty, MAX_EMPTY - 1); // one more try; auto-load resumes only if it finds something
  failed = false;
  const myGen = gen, cursor = next, c = new AbortController();
  ctl = c; requested.add(cursor || '');
  statusEl.textContent = 'Loading…';
  const p = new URLSearchParams({ source: $('#source').value, q: $('#q').value.trim(), sort: $('#sort').value, limit: $('#limit').value });
  if (type !== 'all') p.set('type', type);
  if (cursor) p.set('after', cursor); else p.set('nc', '1'); // the first page of a feed always skips the cache read
  try {
    const r = await fetch('/api/feed?' + p, { signal: c.signal });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (myGen !== gen) return; // a newer search replaced this one: drop the result
    let added = 0, fresh = 0;
    for (const it of j.items) {
      if (!it || typeof it.url !== 'string') continue; // skip malformed entries instead of failing the whole page
      if (seen.has(it.url)) continue; // the same media is never shown twice in one feed
      seen.add(it.url); added++;
      const card_ = card(it); if (!card_.hidden) fresh++; grid.appendChild(card_);
    }
    empty = fresh ? 0 : empty + 1;
    next = j.next || null;
    // end of results: no next cursor, or a cursor we already used that gave nothing new (a looping source)
    done = !next || (requested.has(next) && !added);
    statusEl.textContent = done ? (grid.children.length ? 'End of results' : 'Nothing found') : '';
    if (!done && (!$('#auto').checked || empty >= MAX_EMPTY)) {
      if ($('#auto').checked) statusEl.textContent = 'No matches on the last few pages ';
      const b = document.createElement('button');
      b.textContent = 'Load more'; b.onclick = () => load(false, true);
      statusEl.append(b);
    }
  } catch (e) {
    if (myGen !== gen) return; // aborted because a new search started: nothing to report
    failed = true; // pause auto-loading, but don't treat it as the end: Retry asks for the same page again
    statusEl.textContent = 'Error: ' + e.message + ' ';
    const b = document.createElement('button');
    b.textContent = 'Retry'; b.onclick = () => load(false, true);
    statusEl.append(b);
  } finally {
    if (myGen === gen) ctl = null;
  }
  if (myGen === gen) fill();
}

// With auto-load on, keep loading while the bottom is in view. Scrolling alone never overrides the
// pause (errors, or MAX_EMPTY batches with nothing visible); Load more / Retry / a filter change do.
function fill() {
  if (!$('#auto').checked || done || ctl || failed || empty >= MAX_EMPTY) return;
  if (statusEl.getBoundingClientRect().top < innerHeight + 400) load();
}
let tick = false;
addEventListener('scroll', () => {
  if (tick) return;
  tick = true;
  requestAnimationFrame(() => { tick = false; fill(); });
}, { passive: true });

// ---- tag suggestions ----
const sug = $('#sug');
let sugTimer, sugId = 0;
const hideSug = () => { sugId++; sug.hidden = true; sug.innerHTML = ''; };
$('#q').addEventListener('input', () => {
  clearTimeout(sugTimer); sugId++;
  const v = $('#q').value, m = v.match(/(\S+)$/);
  const word = m && !v.endsWith(' ') ? m[1].replace(/^-/, '') : '';
  if (word.length < 2) return hideSug();
  sugTimer = setTimeout(async () => {
    const id = sugId;
    try {
      const list = await (await fetch('/api/tags?source=' + $('#source').value + '&q=' + encodeURIComponent(word))).json();
      if (id !== sugId || !Array.isArray(list) || !list.length) return hideSug();
      sug.innerHTML = '';
      list.forEach((t) => {
        const d = document.createElement('div');
        d.append(Object.assign(document.createElement('b'), { textContent: t.name }),
                 Object.assign(document.createElement('span'), { textContent: t.count ?? '' }));
        d.onmousedown = (e) => {
          e.preventDefault();
          const cur = $('#q').value, last = cur.match(/(\S+)$/)[1];
          $('#q').value = cur.slice(0, cur.length - last.length) + (last.startsWith('-') ? '-' : '') + t.name + ' ';
          hideSug(); $('#q').focus();
        };
        sug.appendChild(d);
      });
      sug.hidden = false;
    } catch { hideSug(); }
  }, 200);
});
$('#q').addEventListener('blur', hideSug);

// ---- click-to-enlarge viewer ----
const lb = $('#lb');
let cur = null;
const visible = () => [...grid.querySelectorAll('.card')].filter((c) => !c.hidden);
const isHidden = (c) => c.dataset.rating !== 's' && document.body.classList.contains('blurnsfw') && !c.classList.contains('reveal');

function openViewer(c) {
  cur = c;
  const url = c.dataset.url, full = px(url);
  const vid = /\.(mp4|webm)(\?|$)/.test(url);
  const media = document.createElement(vid ? 'video' : 'img');
  if (vid) {
    media.controls = true; media.autoplay = true; media.loop = true;
    if (c.dataset.type === 'gif') { media.setAttribute('muted', ''); media.muted = true; }
  } else media.alt = '';
  media.src = full;
  $('#lbm').replaceChildren(media);
  $('#lbm').classList.toggle('hid', isHidden(c));
  $('#lbt').textContent = c.dataset.title;
  const lh = safeHref(c.dataset.link);
  if (lh) $('#lbl').href = lh; else $('#lbl').removeAttribute('href');
  $('#lbd').textContent = c.classList.contains('saved') ? 'Saved ✓' : 'Save';
  $('#lbtags').replaceChildren(...c.dataset.tags.split(' ').filter(Boolean).slice(0, 60).map((t) => {
    const b = document.createElement('button');
    b.textContent = t;
    b.onclick = () => { closeViewer(); $('#q').value = t; window.scrollTo(0, 0); load(true); };
    return b;
  }));
  const list = visible(), i = list.indexOf(c);
  $('#lbc').textContent = `${i + 1} / ${list.length}`;
  const nx = list[i + 1];
  if (nx && nx.dataset.type === 'image') new Image().src = px(nx.dataset.url); // preload next
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  if (i >= list.length - 3 && !failed) { empty = 0; load(); } // stepping through = deliberate, so it may load more
}
function step(d) {
  const list = visible(), n = list[list.indexOf(cur) + d];
  if (n) openViewer(n);
}
function closeViewer() {
  lb.hidden = true; $('#lbm').innerHTML = ''; cur = null;
  document.body.style.overflow = '';
}
grid.addEventListener('click', (e) => {
  const c = e.target.closest('.card');
  if (!c) return;
  if (e.target.closest('.dl')) saveOne(c);
  else if (e.target.matches('img, video') && isHidden(c)) c.classList.add('reveal');
  else if (e.target.matches('img, video.gifv') || e.target.closest('.view')) openViewer(c);
});
$('#lbm').onclick = () => { if (cur) cur.classList.add('reveal'); $('#lbm').classList.remove('hid'); };
$('#lbd').onclick = async () => { if (cur) { await saveOne(cur); $('#lbd').textContent = 'Saved ✓'; } };
$('#lbp').onclick = () => step(-1);
$('#lbn').onclick = () => step(1);
$('#lbx').onclick = closeViewer;
lb.addEventListener('click', (e) => { if (e.target === lb) closeViewer(); });
let tx = null; // swipe on phones
lb.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
});

// ---- privacy mode ----
const priv = $('#priv');
function togglePriv() {
  const on = priv.hidden;
  priv.hidden = !on;
  document.title = on ? 'Untitled' : 'Media Browser';
  if (on) document.querySelectorAll('video').forEach((v) => v.pause());
}
$('#hide').onclick = () => { panel.hidden = true; togglePriv(); };
priv.onclick = togglePriv;

addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((e.key === '`' && !typing) || (e.key === 'Escape' && !priv.hidden)) { e.preventDefault(); togglePriv(); return; }
  if (e.key === 'Escape' && lb.hidden && !panel.hidden) { panel.hidden = true; return; }
  if (lb.hidden || !priv.hidden) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

// ---- controls ----
$('#source').onchange = () => { hint(); hideSug(); load(true); };
$('#go').onclick = () => { hideSug(); load(true); };
$('#q').onkeydown = (e) => { if (e.key === 'Enter') { hideSug(); load(true); } };
$('#sort').onchange = () => load(true);
$('#rating').onchange = applyFilters;
$('#orient').onchange = applyFilters;
$('#size').oninput = () => { grid.style.columns = $('#size').value + 'px'; save(); };
$('#limit').onchange = () => { save(); load(true); };
$('#blur').onchange = () => { document.body.classList.toggle('blurnsfw', $('#blur').checked); save(); };
$('#auto').onchange = () => { save(); load(true); };
$('#reset').onclick = () => {
  applyState({ ...getState(), q: '', sort: 'latest', type: 'all', rating: 'all', orient: 'all' });
  hideSug(); window.scrollTo(0, 0); load(true);
};
document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { type = b.dataset.t; markType(); load(true); });

// Media that fails to load gets flagged; Refresh retries those (or reloads the feed if none failed)
grid.addEventListener('error', (e) => {
  const c = e.target.closest && e.target.closest('.card');
  if (c) c.classList.add('broken');
}, true);
$('#refresh').onclick = () => {
  const bad = grid.querySelectorAll('.card.broken');
  if (!bad.length) return load(true);
  bad.forEach((c) => {
    c.classList.remove('broken');
    c.querySelectorAll('img, video').forEach((m) => {
      const s = m.getAttribute('src');
      if (s) m.src = s.replace(/&r=\d+$/, '') + '&r=' + Date.now();
    });
  });
  toast(`Retrying ${bad.length} item${bad.length > 1 ? 's' : ''}`);
};

restore();
load(true);
</script>
</body>
</html>
